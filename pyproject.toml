[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-working-memory-paging-daemon"
version = "0.1.0"
description = "Virtual memory manager for context windows paging out dormant memory blocks to secondary storage with LRU eviction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-working-memory-paging-daemon = "agent_working_memory_paging_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_working_memory_paging_daemon*"]
